  - name: VCF0128
    label: Respondent - Religion Major Group
    description: '1952-1964: Is your Church (1962: religious) preference Protestant, Catholic or Jewish?
      1966-1968: Are you Protestant, Catholic or Jewish? 1970-1988,2002: Is your religious preference
      Protestant, Catholic, Jewish, or something else? 1990 AND LATER, exc. 2002: (IF R ATTENDS RELIGIOUS
      SERVICES:) Do you mostly attend a place of worship that is Protestant, Roman Catholic, Jewish or
      what? (IF R DOESN’T ATTEND RELIGIOUS SERVICES:) Regardless of whether you now attend any religious
      services do you ever think of yourself as part of a particular church or denomination? (IF YES:)
      Do you consider yourself Protestant, Roman Catholic, Jewish or what?'
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 4
    details: |
      Codes: 1 = Protestant; 2 = Catholic [Roman Catholic]; 3 = Jewish; 4 = Other and none (also includes DK preference)

      Notes: GENERAL NOTE: See also VCF0129 and VCF0152. In all Pre-Post studies except 1960 this was a Pre var. This has been collapsed from the Study variable summarizing R’s religious self-identification, constructed from the complete set of questions asked, usually including questions additional to those documented here (see questions per VCF0128b,VCF0129). 1990-later (exc. 2002) NOTE: Questions about religious affiliation were preceded by the filter question, ‘Lots of things come up that keep people from attending religious services even if they want to. Thinking about your life these days, do you ever attend religious services, apart from occasional weddings, baptisms or funerals?’ (SEE VCF0130), which had some effect on distributions.
      1948 NOTE: Question wording was undocumented.
      1992 NOTE: This question was not part of the ‘short-form’ questionnaire; for short- form panel cases, however, 1990 study data were incorporated.
      1994 NOTE: For panel cases, 1992 data were incorporated.
      2002 NOTE: For panel cases, 2000 data were incorporated.
      2012 NOTE: In 2012, cases categorized as ‘undifferentiated Christian’ in the major-group summary are coded 4.

      Available: 1948-2024

      Corrected /availability (verified): The codebook's Sources list omits 1954, but the data file has valid answers for 1954.
