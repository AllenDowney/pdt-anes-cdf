  - name: VCF0301
    label: Party Identification of Respondent- 7-point Scale
    description: 'Generally speaking, do you usually think of yourself as a Republican, a Democrat, an
      Independent, or what? (IF REPUBLICAN OR DEMOCRAT) Would you call yourself a strong (REP/DEM) or
      a not very strong (REP/DEM)? (IF INDEPENDENT, OTHER [1966 AND LATER:] OR NO PREFERENCE; 2008: OR
      DK) Do you think of yourself as closer to the Republican or Democratic party?'
    type: number(ordinal)
    range:
    - 1
    - 7
    details: |
      Codes: 1 = Strong Democrat; 2 = Weak Democrat; 3 = Independent - Democrat; 4 = Independent - Independent; 5 = Independent - Republican; 6 = Weak Republican; 7 = Strong Republican

      Notes: GENERAL NOTE: This variable has been revised in accordance with the ANES memo on construction of the Party Identification Summary (available from the ANES Web site). For all years, this variable has been reconstructed in the following consistent manner: Code 1: initial mention Democrat; followup: strong. Code 2: initial mention Democrat; followup: not strong. Code 3: initial preference independent,no preference, other, DK ; followup: Democrat Code 4: initial preference independent,no preference, other, DK ; followup: neither Code 5: initial preference independent,no preference, other, DK ; followup: Republican Code 6: initial mention Republican; followup: not strong. Code 7: initial mention Republican; followup: strong
      2008 NOTE: The order of the parties in the initial question was randomized.

      Available: 1952-2024 (all)

      Corrected /availability (verified): The codebook's Sources list omits 1954, but the data file has valid answers for 1954.
