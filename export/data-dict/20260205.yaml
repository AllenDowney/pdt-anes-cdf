  - name: VCF0101
    label: Respondent - Age
    description: '1964-1976: What is your date of birth? 1978-1982: What is the month and year of your
      birth? 1984-LATER: What is the month, day and year of your birth?'
    type: number(quantity)
    range:
    - 17
    - 96
    details: |
      Codes: 97 = 97 years old (1952, 1974, 1996 and later: or older); 98 = 98 years old (1958-1962, 1966, 1968: or older); 99 = 99 years old (1976-1990,1994,2002: or older)

      Notes: GENERAL NOTE: Prior to 1964 this appeared as a coded staff summary (not as a survey question). Except for 1968, in Pre-Post studies this variable is pre-election. Beginning in 1964, age variables in ANES Study datasets were created by computing R’s age from his/her given date of birth (beginning in 1988, when birthdate was not available, age as given for household listing by R/informant was used instead). The age calculation used in these Study datasets determined age at date of interview in 1966, 1968, 1970, 1972 and 1980-1994; it represented age on November 1 of the year of interview in 1976 and 1978. In 1974, age on election day of the year of interview was calculated. For 1964, no documentation is extant describing exact calculation made. Prior to 1964, instead of age calculated using R’s birthdate, age as given by R/informant (this information may have come from the coversheet) is represented.
      1948 NOTE: Age var was in the form of age groups and could not be included (see VCF0102).
      1954 NOTE: same as 1948.
      1960 NOTE: Personal data forms were completed for no-pre cases: data from these forms were incorporated into the (pre) age var listed.
      1992 NOTE: Birthdate was not asked in short-form interviews: for panel ‘short- form’ cases, 2 years were added to the age that appeared in the 1990 study; for short-form ‘fresh’ cross-section cases, age was pulled from the coversheet.
      2002 NOTE: For panel cases, 2 years were added to the age (if determined) that appeared in the 2000 study.
      2008 NOTE: Age was calculated from year of birth.
      2016 NOTE: Age was calculated from year of birth.

      Available: 1952-2024
