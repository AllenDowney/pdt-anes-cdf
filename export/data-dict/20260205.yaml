  - name: VCF0837
    label: When Should Abortion Be Allowed
    description: '(1972,1976: Still on the subject of women’s rights,) There has been some discussion
      about abortion during recent years. Which one of the opinions on this page (1972: card) best agrees
      with your view? You can just tell me the number of the opinion you choose.'
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 4
    - 9
    details: |
      Codes: 1 = Abortion should never be permitted.; 2 = Abortion should be permitted only if the life and health of the woman is in danger.; 3 = Abortion should be permitted if, due to personal reasons, the woman would have difficulty in caring for the child.; 4 = Abortion should never be forbidden, since one should not require a woman to have a child she doesn’t want.; 9 = DK; other

      Notes: GENERAL NOTE: See also VCF0838.
      1980 NOTE: Asked post-election. Alternate version (ssee VCF0838) asked pre-election.

      Available: 1972,1976-1980 (not 1974)
