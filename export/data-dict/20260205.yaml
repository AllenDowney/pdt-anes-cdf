      2008 NOTE: This question was administered to a random half sample of respondents using verion ‘OLD’; the remaining respondents (version ‘NEW’) were administered a branching series of questions on abortion.
      2016 NOTE: For Web cases, the Other option was not available.

      Available: 1980-2000,2004-2024 (not 2002)
