  - name: VCF0702
    label: Did Respondent Vote in the National Elections
    description: In the election, about half the people voted and about half of them didn’t. Did you vote?
    type: number(id)
    examples:
    - 1
    - 2
    details: |
      Codes: 1 = No, did not vote; 2 = Yes, voted

      Wording 2 (waves 1962): One of the things we need to know is whether or not people really did get to vote this fall. In talking to people about the election we find that a lot of people weren’t able to vote because they weren’t registered or they were sick or something else came up at the last minute. Do you remember for sure whether or not you voted in the November election? 1952-1960,1964-1998, 2002 VERSION 1, and 2004 VERSION 1: In talking to people about the election we (1972 AND LATER: often) find that a lot of people weren’t able to vote because they weren’t registered or they were sick or they just didn’t have time. (1956-1960: How about you, did you vote this time?) (1964-1970: How about you, did you vote this time, or did something keep you from voting) (1972-1976: How about you, did you vote in the elections this fall?) (1978 and later: How about you, did you vote in the elections this November?) 2000, 2002 VERSION2, and 2004 VERSION 1: In talking to people about elections, we often find that a lot of people were not able to vote because they weren’t registered, they were sick, or they just didn’t have time. Which of the following statements best describes you: One, I did not vote (in the election this November); Two, I thought about voting this time - but didn’t; Three, I usually vote, but didn’t this time; or Four, I am sure I voted?

      Notes: GENERAL NOTE: Code 2 includes 8 respondents from 1958, 8 respondents from 1962 and 14 respondents from 1968, who replied ‘yes, I think so.’
      1956 NOTE: Code 2 includes 3 cases from: ‘Nonvoter, NA preference; voted, but not for president’.
      1982 NOTE: For congressional districts GA04 and GA05, an additional question appeared: How about the special US Congressional elections held November 30th. Did you vote in that election? From 1982, code 2 includes all GA04, GA05 respondents who voted in either the November 2 general election or the November 30 special election, or both.
      2002 NOTE: Respondents were randomly assigned to either version 1 or version 2.

      Available: 1948-2024 (all)
