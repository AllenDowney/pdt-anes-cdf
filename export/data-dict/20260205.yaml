  - name: VCF0713
    label: Respondent Pre-election Intent for Vote for President
    description: So far as you know now, do you expect to vote in the national elections this coming November
      or not? (IF YES:) Who do you think you will vote for in the election for President?
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 4
    - 9
    details: |
      Codes: 1 = Democratic candidate (with or without qualifications, 1952-1976); 2 = Republican candidate (with or without qualifications, 1952-1976); 3 = Undecided; DK (except 1964); 4 = R does not intend to vote (incl. ‘no, qualified’ if will vote, 1952-1976) or does not intend to vote for President; 9 = Other candidate

      Wording 2 (waves 1948): On the coming Presidential election, do you plan to vote? (IF RESPONSE NOT ‘NO’:) Do you plan to vote Republican, Democrat or something else?

      Wording 3: We all know the election is some time away and people are not certain at this point who they will vote for. Still, who do you think you will vote for in the election for President? 2012 PRE-ELECTION: (IF R IS NOT REGISTERED BUT INTENDS TO REGISTER, OR IF R IS REGISTERED BUT DID NOT VOTE YET:) How about the election for President? Do you intend to vote for a candidate for PRESIDENT? (IF YES:) Who do you think you will vote for? [DEM PRES CAND NAME], [REP PRES CAND NAME], or someone else?

      Notes: GENERAL NOTE: This is a pre var. For 1952-1976, codes 1 and 3 also include presidential candidate vote intentions ‘with qualifications.’ Codes for candidate vote intention ‘with qualifications’ did not appear after 1976. In 1952-1976, if R’s response to the question ‘As far as you know, do you expect to vote in the elections this November?’ was ‘yes, qualified’ (think so/ guess so/ probably, etc.), R was asked this question; if R’s response was ‘no, qualified’ (probably not, etc.) R has been included in code 4; if R’s response was ‘pro-con,’ then this has been coded 0. After 1976, no codes appeared for ‘yes, qualified,’ ‘no, qualified,’ or ‘pro-con’.

      Available: phase pre 1948-1956,1960,1964,1968,1972,1976,1980,1984,1988,1992,1996,2000,2004-2024 (not 12 waves)
