    label: By Law, When Should Abortion Be Allowed
    description: There has been some discussion about abortion during recent years. (RESPONDENT BOOKLET)
      Which one of the opinions on this page best agrees with your view? You can just tell me the number
      of the opinion you choose.
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 4
    - 9
    details: |
      Codes: 1 = By law, abortion should never be permitted.; 2 = The law should permit abortion only in case of rape, incest, or when the woman’s life is in danger.; 3 = The law should permit abortion for reasons other than rape, incest, or danger to the woman’s life, but only after the need for the abortion has been clearly established.; 4 = By law, a woman should always be able to obtain an abortion as a matter of personal choice.; 9 = DK; other

      Wording 2 (waves 2000; modes telephone): I am going to read you a short list of opinions. Please tell me which one of the opinions best agrees with your view. You can just tell me the number of the opinion you choose.

      Notes: GENERAL NOTE: See also VCF0837.
