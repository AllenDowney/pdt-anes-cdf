  - name: VCF0130
    label: Respondent - Church Attendance 1970-
    description: '1970-1988: (IF ANY RELIGIOUS PREFERENCE) Would you say you/do you go to (church/synagogue)
      every week, almost every week, once or twice a month, a few times a year, or never? 1990 AND LATER:
      Lots of things come up that keep people from attending religious services even if they want to.
      Thinking about your life these days, do you ever attend religious services, apart from occasional
      weddings, baptisms or funerals? (IF YES:) Do you go to religious services every week, almost every
      week, once or twice a month, a few times a year, or never?'
    type: number(ordinal)
    range:
    - 1
    - 7
    details: |
      Codes: 1 = Every week (Except 1970: almost every week); 2 = Almost every week (no cases in 1970); 3 = Once or twice a month; 4 = A few times a year; 5 = Never (1990 and later: ‘No’ in filter); 7 = No religious preference (1970-1988)

      Notes: GENERAL NOTE: Beginning in 1990, question flow was reversed so that the religious attendance question preceded religious affiliation questions, whereas in previous studies religious attendance followed. Beginning in 1990, frequency of religious attendance was preceded by a general attendance filter (yes/no); a ‘no’ response to the filter 1990 and later has been coded 5 here.
      1970 NOTE: Only codes corresponding to VCF0130 codes 2-5 were used (no code for ‘every week’). ‘Almost every week’ from 1970 has been recoded to 1, with no 1970 cases appearing in code 2.
      1992 NOTE: This question was not part of the ‘short-form’ questionnaire; for short- form panel cases, however, 1990 study data were incorporated.
      1994 NOTE: For Panel respondents,1992 data have been included.

      Available: 1970-2024
