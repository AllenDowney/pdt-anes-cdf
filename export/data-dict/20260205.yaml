  - name: VCF0803
    label: Liberal-Conservative Scale
    description: 'We hear a lot of talk these days about liberals and conservatives. Here is (1972,1974:
      I’m going to show you) a 7-point scale on which the political views that people might hold are arranged
      from extremely liberal to extremely conservative. Where would you place yourself on this scale,
      or haven’t you thought much about this? (7-POINT SCALE SHOWN TO R)'
    type: number(ordinal)
    range:
    - 1
    - 9
    details: |
      Codes: 1 = Extremely liberal; 2 = Liberal; 3 = Slightly liberal; 4 = Moderate, middle of the road; 5 = Slightly conservative; 6 = Conservative; 7 = Extremely conservative; 9 = DK; haven’t thought much about it

      Wording 2 (waves 2000; modes telephone): When it comes to politics, do you usually think of yourself as extremely liberal, liberal, slightly liberal, moderate or middle of the road, slightly conservative, extremely conservative, or haven’t you thought much about this?

      Wording 3 (waves 2002): We hear a lot of talk these days about liberals and conservatives. When it comes to politics, do you usually think of yourself as extremely liberal, liberal, slightly liberal, moderate or middle of the road, slightly conservative, extremely conservative, or haven’t you thought much about this?

      Notes: GENERAL NOTE: For years 1984 and later, a follow-up ‘choice’ question was asked of respondents who replied ‘don’t know’ or ‘haven’t thought much’ to this question; except for years 1984, 1986 and 1990 this follow-up ‘choice’ question was also asked of respondents who answered ‘moderate.’ For these years, a final 3-category summary was constructed: the ‘choice’ question is found in VCF0824; the final 3-category summary is VCF0849.
      2000 NOTE: This variable represents 7-point scale data from interviews conducted using both modes (telephone and personal). In addition to the traditional 7-point scale version of this question, approximately half of the 2000 Study respondents (both modes) were instead randomly selected for administration of a branching series.
      2012 NOTE: Due to an error in the technical specifications, option ‘Haven’t thought much about it’ was not included in the web instrument; code 9 represents FTF cases only.

      Available: 1972-2024
