  - name: VCF0830
    label: Aid to Blacks Scale
    description: 'Some people feel that the government in Washington should make every possible effort
      to improve the social and economic position of blacks (1970: Negroes) and other minority groups
      (1980: even if it means giving them preferential treatment). Others feel that the government should
      not make any special effort to help minorities because they should help themselves (1970: but they
      should be expected to help themselves). 1986 FORM A,'
    type: number(ordinal)
    range:
    - 1
    - 9
    details: |
      Codes: 1 = Government should help minority groups/blacks; 2 = ; 3 = ; 4 = ; 5 = ; 6 = ; 7 = Minority groups/ blacks should help themselves; 9 = DK; haven’t thought much about it

      Wording 2: Some people feel that the government in Washington should make every (prior to 1996 only: possible) effort to improve the social and economic position of blacks. (1996-LATER: Suppose these people are at one end of a scale, at point 1). Others feel that the government should not make any special effort to help blacks because they should help themselves. (1996-LATER: Suppose these people are at the other end, at point 7. And, of course, some other people have opinions somewhere in between, at points 2,3,4,5 or 6). ALL YEARS: Where would you place yourself on this scale, or haven’t you thought much about it? (7-POINT SCALE SHOWN TO R)

      Notes: GENERAL NOTE: Note that form B in 1986, form B in 1988, and all previous years specified ‘blacks and other minorities’ in this question, while form A in 1986, form A in 1988, and all cases in 1990 and after specified only ‘blacks.’ To filter for form A/B responses, use variable VCF0012.
      2000 NOTE: This variable represents 7-point scale data from interviews conducted face-to-face; telephone respondents were administered asked a branching series and are not represented here.

      Available: 1970-2000,2004-2024 (not 2002)

      Corrected /availability (verified): The codebook's Sources list omits 2012, but the data file has valid answers for 2012.
